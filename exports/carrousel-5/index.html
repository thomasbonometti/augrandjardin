<!doctype html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Le 8 octobre, heure par heure — Kraft #6</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;800;900&display=swap">
<style>
:root{--ground:#0A0A0A;--line:#282C26;--ink:#FFF;--dim:#8B918A;--accent:#92FF6B;--flag:#F3C969;
--sans:"Archivo","Helvetica Neue",Helvetica,Arial,sans-serif;--mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
color-scheme:dark;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--sans);display:flex;flex-direction:column;overflow:hidden}
.bar{flex:0 0 auto;display:flex;align-items:center;gap:14px;padding:12px 16px 10px;border-bottom:1px solid var(--line)}
.mark{font-weight:900;font-size:19px;letter-spacing:-.045em;line-height:1;white-space:nowrap}
.mark em{font-style:normal;color:var(--accent)}
.tabs{display:flex;gap:6px;margin-left:auto}
.tab{font-family:inherit;font-weight:800;font-size:13px;padding:7px 13px;border-radius:999px;border:1px solid var(--line);
background:transparent;color:var(--dim);cursor:pointer;transition:background .16s,color .16s,border-color .16s}
.tab[aria-selected="true"]{background:var(--accent);color:#000;border-color:var(--accent)}
.tab:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.vline{flex:0 0 auto;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;padding:10px 16px 4px}
.vname{font-weight:800;font-size:15px}
.vdesc{font-size:12.5px;color:var(--dim)}
.deck{flex:1 1 auto;min-height:0;position:relative}
.strip{height:100%;display:flex;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;scroll-behavior:smooth;scrollbar-width:none}
.strip::-webkit-scrollbar{display:none}
.frame{flex:0 0 100%;scroll-snap-align:center;scroll-snap-stop:always;display:flex;align-items:center;justify-content:center;padding:8px 16px;margin:0}
.frame img{height:100%;width:auto;max-width:100%;max-height:100%;object-fit:contain;display:block;background:#000;border-radius:3px}
.nav{position:absolute;top:50%;transform:translateY(-50%);width:38px;height:38px;border-radius:999px;border:1px solid var(--line);
background:rgba(10,10,10,.72);color:var(--ink);cursor:pointer;display:none;align-items:center;justify-content:center;font-size:16px}
.nav[disabled]{opacity:.28;cursor:default}
.nav.prev{left:8px}.nav.next{right:8px}
@media (hover:hover) and (pointer:fine){.nav{display:flex}}
.foot{flex:0 0 auto;padding:8px 16px 14px}
.dots{display:flex;gap:5px;justify-content:center;padding:2px 0 10px;flex-wrap:wrap}
.dot{width:6px;height:6px;border-radius:999px;background:#33382F;border:0;padding:0;cursor:pointer;transition:width .18s,background .18s}
.dot[aria-current="true"]{width:20px;background:var(--accent)}
.meta{display:flex;align-items:center;gap:10px;flex-wrap:wrap;min-height:34px}
.code{font-family:var(--mono);font-size:12px;color:var(--accent);letter-spacing:.04em;font-variant-numeric:tabular-nums}
.dim{font-family:var(--mono);font-size:12px;color:var(--dim);font-variant-numeric:tabular-nums}
.flag{font-size:12px;line-height:1.35;color:var(--flag);border-left:2px solid var(--flag);padding-left:9px;flex:1 1 220px;min-width:0}
.note{margin-top:10px;padding-top:10px;border-top:1px solid var(--line);font-size:11.5px;color:var(--dim);line-height:1.45}
.note b{color:var(--ink);font-weight:600}
@media (prefers-reduced-motion:reduce){.strip{scroll-behavior:auto}.dot,.tab{transition:none}}
@media (max-width:380px){.tab{padding:7px 10px;font-size:12px}.mark{font-size:17px}}
</style></head><body>

  <div class="dots" id="dots"></div>
  <div class="meta"><span class="code" id="code"></span><span class="dim">1080 &times; 1350</span><span class="flag" id="flag" hidden></span></div>
  <p class="note">Typo <b>Archivo</b> en placeholder — Roc Grotesk n'est pas chargeable en écriture depuis la session. Vert Kraft <b>#92FF6B</b>. Photos saison 1 : Alexandra Koeniguer, Bartosch Salmanski.</p>
</div>
<script>
(function(){
 var N=SLIDES.A.length, version="A", index=0;
 var strip=document.getElementById("strip"), dots=document.getElementById("dots");
 var code=document.getElementById("code"), flag=document.getElementById("flag");
 var vname=document.getElementById("vname"), vdesc=document.getElementById("vdesc");
 var prev=document.getElementById("prev"), next=document.getElementById("next");
 var imgs=[], dotEls=[];
 for(var i=0;i<N;i++){
   var fig=document.createElement("figure"); fig.className="frame";
   var img=document.createElement("img"); img.alt="Slide "+(i+1)+" sur "+N; img.decoding="async";
   fig.appendChild(img); strip.appendChild(fig); imgs.push(img);
   var d=document.createElement("button"); d.className="dot"; d.type="button";
   d.setAttribute("aria-label","Slide "+(i+1)); d.dataset.i=i; dots.appendChild(d); dotEls.push(d);
 }
 function paint(){
   code.textContent=version+"-"+String(index+1).padStart(2,"0");
   var f=ALERTES[version==="C"?"C":version] && ALERTES[version==="C"?"C":version][index];
   if(f){flag.textContent=f;flag.hidden=false;}else{flag.textContent="";flag.hidden=true;}
   for(var i=0;i<N;i++)dotEls[i].setAttribute("aria-current",i===index?"true":"false");
   prev.disabled=index===0; next.disabled=index===N-1;
 }
 function setVersion(v){
   version=v;
   for(var i=0;i<N;i++) imgs[i].src=SLIDES[v][i];
   vname.textContent=VERSIONS[v].name; vdesc.textContent=VERSIONS[v].desc;
   ["A","B","C"].forEach(function(k){document.getElementById("tab-"+k).setAttribute("aria-selected",k===v?"true":"false");});
   paint();
   try{localStorage.setItem("kraft6-c5-version",v);}catch(e){}
 }
 function goTo(i,smooth){
   index=Math.max(0,Math.min(N-1,i));
   var pb=strip.style.scrollBehavior; if(smooth===false)strip.style.scrollBehavior="auto";
   strip.scrollLeft=index*strip.clientWidth; if(smooth===false)strip.style.scrollBehavior=pb;
   paint();
 }
 var raf=0;
 strip.addEventListener("scroll",function(){
   if(raf)return; raf=requestAnimationFrame(function(){raf=0;
     var w=strip.clientWidth||1, i=Math.round(strip.scrollLeft/w);
     if(i!==index){index=Math.max(0,Math.min(N-1,i));paint();}});
 },{passive:true});
 ["A","B","C"].forEach(function(k){document.getElementById("tab-"+k).addEventListener("click",function(){setVersion(k);});});
 dots.addEventListener("click",function(e){var b=e.target.closest(".dot"); if(b)goTo(Number(b.dataset.i),true);});
 prev.addEventListener("click",function(){goTo(index-1,true);});
 next.addEventListener("click",function(){goTo(index+1,true);});
 document.addEventListener("keydown",function(e){
   if(e.key==="ArrowRight"){goTo(index+1,true);e.preventDefault();}
   else if(e.key==="ArrowLeft"){goTo(index-1,true);e.preventDefault();}});
 window.addEventListener("resize",function(){goTo(index,false);});
 var saved=null; try{saved=localStorage.getItem("kraft6-c5-version");}catch(e){}
 setVersion(saved&&VERSIONS[saved]?saved:"A");
})();
</script></body></html>
